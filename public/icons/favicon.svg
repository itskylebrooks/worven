<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <style>
    .icon-stroke {
      stroke: #1c1c1a;
    }

    .icon-fill {
      fill: #1c1c1a;
    }

    @media (prefers-color-scheme: dark) {
      .icon-stroke {
        stroke: #ffffff;
      }

      .icon-fill {
        fill: #ffffff;
      }
    }
  </style>
  <defs>
    <clipPath id="overlap">
      <circle cx="118" cy="82" r="52" />
    </clipPath>
  </defs>
  <circle cx="82" cy="118" r="52" fill="none" class="icon-stroke" stroke-width="14" />
  <circle cx="118" cy="82" r="52" fill="none" class="icon-stroke" stroke-width="14" />
  <circle cx="82" cy="118" r="52" class="icon-fill" clip-path="url(#overlap)" />
</svg>
